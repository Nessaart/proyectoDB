<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ticket USB - Panel de Pruebas</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      max-width: 600px; 
      margin: 40px auto; 
      padding: 20px; 
      background-color: #f4f4f9; 
      color: #333;
    }
    section { 
      background: white; 
      padding: 24px; 
      margin-bottom: 24px; 
      border-radius: 10px; 
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); 
    }
    h1 {
      color: #2b2b2b;
      text-align: center;
      margin-bottom: 30px;
    }
    h2 { 
      margin-top: 0; 
      color: #6200ee; 
      font-size: 1.25rem; 
      border-bottom: 2px solid #f0f0f5;
      padding-bottom: 8px;
    }
    label { 
      font-size: 0.9rem; 
      font-weight: 600; 
      color: #555; 
    }
    input { 
      width: 100%; 
      padding: 10px; 
      margin: 6px 0 16px 0; 
      box-sizing: border-box; 
      border: 1px solid #ddd; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #6200ee;
    }
    button { 
      background-color: #6200ee; 
      color: white; 
      padding: 12px 15px; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      width: 100%; 
      font-weight: bold;
      font-size: 1rem;
      transition: background-color 0.2s;
    }
    button:hover { 
      background-color: #3700b3; 
    }
    /* Estética mejorada para la caja de resultados JSON */
    pre { 
      background: #f8f9fa; 
      border: 1px solid #e9ecef;
      padding: 14px; 
      border-radius: 6px; 
      overflow-x: auto; 
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.85rem;
      color: #212529;
      margin-top: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>

<body>
  <div>
    <h1>Ticket USB - API Testing</h1>

    <!-- Sección de Registro -->
    <section>
      <h2>Registro de Usuario</h2>
      <label for="regNombre">Nombre Completo:</label>
      <input type="text" id="regNombre" required>

      <label for="regCorreo">Correo Electrónico:</label>
      <input type="email" id="regCorreo" required>

      <label for="regPassword">Contraseña:</label>
      <input type="password" id="regPassword" required>

      <button id="registerBtn">Registrarse</button>
      <pre id="registerResult">Esperando acción...</pre>
    </section>

    <!-- Sección de Inicio de Sesión -->
    <section>
      <h2>Iniciar Sesión</h2>
      <label for="loginCorreo">Correo Electrónico:</label>
      <input type="email" id="loginCorreo" required>

      <label for="loginPassword">Contraseña:</label>
      <input type="password" id="loginPassword" required>

      <button id="loginBtn">Ingresar</button>
      <pre id="loginResult">Esperando acción...</pre>
    </section>
  </div>

  <script src="./js/sql.js"></script>
</body>

</html>
